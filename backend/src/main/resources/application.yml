spring:
  application:
    name: credit-risk-api
  # Load variables from a .env file in the backend dir or the project root, if present.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Alternatively set DATABASE_URL=postgresql://user:pass@host:port/db (as Render provides);
    # see DatabaseUrlEnvironmentPostProcessor.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creditrisk}
    username: ${POSTGRES_USER:creditrisk}
    password: ${POSTGRES_PASSWORD:creditrisk}
  # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Hosting platforms such as Render inject PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256. Override in production!
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
