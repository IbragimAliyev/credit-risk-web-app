# Render Blueprint: deploys PostgreSQL + Spring Boot API + React static site.
# Usage: Render dashboard -> New -> Blueprint -> select this repo. See docs/DEPLOYMENT.md.

databases:
  - name: risklens-db
    plan: free # free Render Postgres expires 30 days after creation
    databaseName: creditrisk
    user: creditrisk
    postgresMajorVersion: "16"

services:
  - type: web
    name: risklens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: risklens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # Public URL of the frontend, e.g. https://risklens-web.onrender.com (asked during setup)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: risklens-web
    runtime: static
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Single-page app: serve index.html for client-side routes like /login
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of the API, e.g. https://risklens-api.onrender.com (asked during setup)
      - key: VITE_API_BASE_URL
        sync: false
